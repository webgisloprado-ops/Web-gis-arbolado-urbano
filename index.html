<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sistema Inteligente de Arbolado Urbano</title>
  <meta name="description" content="Plataforma GIS de gestión, análisis y consulta ciudadana del arbolado urbano." />
  <meta name="color-scheme" content="light dark" />

  <!-- Mapa: Leaflet + clustering + heatmap (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header" id="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="Inicio">
        <span class="brand-mark" aria-hidden="true">🌳</span>
        <span class="brand-text">
          <strong>Arbolado Urbano</strong>
          <small>Sistema Inteligente GIS</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#/mapa" data-route="mapa">Mapa</a>
        <a href="#/especies" data-route="especies">Especies</a>
        <a href="#/estadisticas" data-route="estadisticas">Estadísticas</a>
        <a href="#/importar" data-route="importar">Importar</a>
        <a href="#/admin" data-route="admin">Admin</a>
      </nav>

      <div class="header-actions">
        <button class="btn-icon" id="btn-search" aria-label="Buscar" title="Buscar (⌘/Ctrl + K)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
        </button>
        <button class="btn-icon" id="btn-theme" aria-label="Cambiar tema" title="Tema claro / oscuro">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn-icon nav-toggle" id="nav-toggle" aria-label="Menú" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="app-main" tabindex="-1"></main>

  <!-- Buscador global (command palette) -->
  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Buscador global">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="search-ico"><path d="M21 21l-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
        <input type="search" id="search-input" placeholder="Buscar especie, código, dirección o familia…" autocomplete="off" aria-label="Buscar" />
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="search-hint">Ej.: <button class="chip" data-q="Quillay">Quillay</button>
        <button class="chip" data-q="Jacaranda">Jacaranda</button>
        <button class="chip" data-q="nativa">nativa</button>
        <button class="chip" data-q="ARB-01024">ARB-01024</button></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Librerías de mapa (se cargan de forma diferida al entrar al mapa) -->
  <script>window.__CDN = {
    leaflet: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
    cluster: 'https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js',
    heat: 'https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js',
    chart: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',
    qr: 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'
  };</script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
